name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '**.md'
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  guard:
    name: CI must be green
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Check most recent CI run on the same ref
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CONCLUSIONS=$(gh run list \
            --workflow CI \
            --branch "${{ github.ref_name }}" \
            --limit 1 \
            --json conclusion \
            --jq '.[0].conclusion // "none"')
          if [ "$CONCLUSIONS" = "success" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Most recent CI run conclusion: $CONCLUSIONS — skipping deploy."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build
    needs: guard
    if: ${{ needs.guard.outputs.proceed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build site
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build -- --base="$BASE_PATH"

      - name: Add SPA fallback (404.html mirrors index.html so client routes resolve on refresh)
        run: cp dist/index.html dist/404.html

      - name: Verify build output
        run: |
          test -f dist/index.html || (echo "::error::dist/index.html missing" && exit 1)
          test -d dist/assets || (echo "::error::dist/assets missing" && exit 1)

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4